<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Hokejová Časomíra PRO</title>
    <style>
        :root {
            --bg-blue: #1b89e3;
            --bg-black: #000;
            --dot-goal: #2ecc71;
            --dot-miss: #e74c3c;
            --board-height: 85px;
        }

        body {
            font-family: "Arial Black", sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SCOREBOARD */
        #scoreboard-wrapper { width: 100%; max-width: 1000px; margin-bottom: 95px; transition: opacity 0.3s; }
        .hidden { opacity: 0; pointer-events: none; }

        .scoreboard {
            display: flex;
            justify-content: center;
            height: var(--board-height);
            background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: visible;
            width: fit-content;
            margin: 0 auto;
        }

        .box { display: flex; align-items: center; justify-content: center; text-align: center; }
        
        /* Týmy */
        .team { width: 220px; background-color: var(--bg-blue); color: white; font-size: 28px; position: relative; text-transform: uppercase; }
        
        .score { width: 80px; font-size: 55px; background: #fff; font-weight: 900; border-left: 1px solid #eee; border-right: 1px solid #eee; }
        .period-box { width: 80px; height: 100%; background: #fff; color: #000; font-size: 45px; font-weight: 900; border-right: 1px solid #eee; }
        
        /* STŘEDNÍ BLOK - UPRAVENÁ ŠÍŘKA */
        .center-display { width: 220px; background: #fff; display: flex; position: relative; }
        .timer-box { width: 100%; font-size: 55px; font-variant-numeric: tabular-nums; font-weight: 900; }
        
        .so-display { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; gap: 8px; }
        .so-row { display: flex; gap: 6px; }
        .dot { width: 16px; height: 16px; border-radius: 50%; background: #ddd; border: 1px solid #aaa; }
        .dot.goal { background: var(--dot-goal); border-color: #27ae60; }
        .dot.miss { background: var(--dot-miss); border-color: #c0392b; }
        
        .mode-so .timer-box, .mode-so .period-box { display: none; }
        .mode-so .so-display { display: flex; }

        .penalty-area { position: absolute; top: 100%; left: 0; width: 100%; background-color: var(--bg-blue); border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
        .penalty-row { height: 30px; border-top: 1px solid rgba(255,255,255,0.4); font-size: 22px; display: flex; align-items: center; justify-content: center; }

        /* ADMIN PANEL */
        .admin-panel {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 850px;
            color: white;
            border: 2px solid #333;
        }
        .admin-group { background: #252525; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        h3 { margin: 0; font-size: 11px; color: #888; text-transform: uppercase; }
        
        .period-selector { display: flex; gap: 4px; }
        .period-selector button { flex: 1; padding: 8px 0; background: #444; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .period-selector button.active { background: var(--bg-blue); }

        button { cursor: pointer; padding: 10px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-blue { background: var(--bg-blue); color: white; }
        .btn-start { background: #2ecc71; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
        .btn-timeout { background: #f39c12; color: white; }
        input { background: #333; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; text-align: center; }
        
        .so-admin-ctrl { display: none; flex-direction: column; gap: 5px; }
        .mode-so .so-admin-ctrl { display: flex; }
        .mode-so .penalty-admin-ctrl { display: none; }
    </style>
</head>
<body>

    <div id="scoreboard-wrapper">
        <div class="scoreboard">
            <div class="box team">
                <span id="name-home-display">DOM</span>
                <div id="penalties-home" class="penalty-area"></div>
            </div>
            
            <div class="box score" id="disp-score-home">0</div>
            <div class="box score" id="disp-score-away">0</div>
            
            <div class="box team">
                <span id="name-away-display">HOS</span>
                <div id="penalties-away" class="penalty-area"></div>
            </div>

            <div class="box period-box" id="disp-period">1</div>

            <div class="box center-display">
                <div class="box timer-box" id="disp-time">20:00</div>
                <div class="so-display">
                    <div class="so-row" id="so-dots-home"></div>
                    <div class="so-row" id="so-dots-away"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-panel">
        <div class="admin-group">
            <h3>Období zápasu</h3>
            <div class="period-selector" id="p-selector">
                <button onclick="setPeriod('1')" class="active">1</button>
                <button onclick="setPeriod('2')">2</button>
                <button onclick="setPeriod('3')">3</button>
                <button onclick="setPeriod('OT')">OT</button>
                <button onclick="setPeriod('SO')">SO</button>
            </div>
            <button id="mainBtn" class="btn-start" onclick="toggleTimer()">START / STOP</button>
            <button id="timeoutBtn" class="btn-timeout" onclick="triggerTimeout()">TIMEOUT (25s)</button>
            
            <div style="display:flex; gap:4px; margin-top:5px;">
                <input type="number" id="in-min" value="20" style="width:45%">
                <input type="number" id="in-sec" value="0" style="width:45%">
            </div>
            <button class="btn-blue" onclick="setManualTime()" style="font-size:11px">NASTAVIT ČAS</button>
            <button class="btn-blue" onclick="toggleBoard()" style="background:#555; margin-top:5px">ZOBRAZIT / SKRÝT</button>
        </div>

        <div class="admin-group">
            <h3>Domácí</h3>
            <input type="text" id="in-name-home" value="DOM" oninput="updateNames()">
            <button class="btn-blue" onclick="changeScore('home', 1)">GÓL +</button>
            <div class="penalty-admin-ctrl">
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px">
                    <button class="btn-blue" onclick="addPenalty('home', 2)">2M</button>
                    <button class="btn-blue" onclick="addPenalty('home', 4)">4M</button>
                    <button class="btn-blue" onclick="addPenalty('home', 5)">5M</button>
                </div>
                <div id="ctrl-list-home"></div>
            </div>
            <div class="so-admin-ctrl">
                <div style="display:flex; gap:5px"><button class="btn-start" style="flex:1" onclick="addSO('home', 'goal')">GÓL</button><button class="btn-stop" style="flex:1" onclick="addSO('home', 'miss')">X</button></div>
                <button onclick="resetSO('home')" style="font-size:10px; background:none; color:gray; border:1px solid #444; margin-top:5px">RESET NÁJEZDŮ</button>
            </div>
            <button class="btn-blue" onclick="changeScore('home', -1)" style="font-size:10px; opacity:0.5; margin-top:auto">-1 BOD</button>
        </div>

        <div class="admin-group">
            <h3>Hosté</h3>
            <input type="text" id="in-name-away" value="HOS" oninput="updateNames()">
            <button class="btn-blue" onclick="changeScore('away', 1)">GÓL +</button>
            <div class="penalty-admin-ctrl">
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px">
                    <button class="btn-blue" onclick="addPenalty('away', 2)">2M</button>
                    <button class="btn-blue" onclick="addPenalty('away', 4)">4M</button>
                    <button class="btn-blue" onclick="addPenalty('away', 5)">5M</button>
                </div>
                <div id="ctrl-list-away"></div>
            </div>
            <div class="so-admin-ctrl">
                <div style="display:flex; gap:5px"><button class="btn-start" style="flex:1" onclick="addSO('away', 'goal')">GÓL</button><button class="btn-stop" style="flex:1" onclick="addSO('away', 'miss')">X</button></div>
                <button onclick="resetSO('away')" style="font-size:10px; background:none; color:gray; border:1px solid #444; margin-top:5px">RESET NÁJEZDŮ</button>
            </div>
            <button class="btn-blue" onclick="changeScore('away', -1)" style="font-size:10px; opacity:0.5; margin-top:auto">-1 BOD</button>
        </div>
    </div>

    <script>
        let timeLeft = 1200000, isRunning = false, lastTs = 0;
        let scoreHome = 0, scoreAway = 0, penaltiesHome = [], penaltiesAway = [], soHome = [], soAway = [];
        let isTimeout = false, savedGameTime = 0;

        function updateNames() {
            document.getElementById('name-home-display').innerText = document.getElementById('in-name-home').value;
            document.getElementById('name-away-display').innerText = document.getElementById('in-name-away').value;
        }

        function toggleBoard() { document.getElementById('scoreboard-wrapper').classList.toggle('hidden'); }

        function setPeriod(p) {
            document.getElementById('disp-period').innerText = p;
            document.body.className = (p === 'SO') ? 'mode-so' : '';
            
            if (p === 'OT') {
                timeLeft = 5 * 60 * 1000;
                document.getElementById('in-min').value = 5;
                document.getElementById('in-sec').value = 0;
            } else if (p === '1' || p === '2' || p === '3') {
                timeLeft = 20 * 60 * 1000;
                document.getElementById('in-min').value = 20;
                document.getElementById('in-sec').value = 0;
            }

            const btns = document.querySelectorAll('#p-selector button');
            btns.forEach(btn => btn.classList.toggle('active', btn.innerText === p));
            updateDisplay();
        }

        function formatMainTime(ms) {
            if (ms < 60000 || isTimeout) {
                let s = Math.floor(ms / 1000);
                let d1 = Math.floor((ms % 1000) / 100);
                return `${s}.${d1}`;
            }
            let ts = Math.ceil(ms / 1000);
            return `${Math.floor(ts / 60)}:${(ts % 60).toString().padStart(2, '0')}`;
        }

        function formatPenaltyTime(ms) {
            let ts = Math.ceil(ms / 1000);
            return `${Math.floor(ts / 60)}:${(ts % 60).toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            document.getElementById('disp-time').innerText = formatMainTime(timeLeft);
            document.getElementById('disp-score-home').innerText = scoreHome;
            document.getElementById('disp-score-away').innerText = scoreAway;
            renderPen('home'); renderPen('away');
            renderSO();
        }

        function renderPen(t) {
            const list = (t === 'home') ? penaltiesHome : penaltiesAway;
            const sb = document.getElementById('penalties-' + t);
            const ctrl = document.getElementById('ctrl-list-' + t);
            sb.innerHTML = ''; ctrl.innerHTML = '';
            list.forEach((p, i) => {
                const div = document.createElement('div'); div.className = 'penalty-row';
                div.innerText = formatPenaltyTime(p.remaining); sb.appendChild(div);
                const c = document.createElement('div'); c.style.display="flex"; c.style.justifyContent="space-between"; c.style.marginTop="5px";
                c.innerHTML = `<span style="font-size:10px">${formatPenaltyTime(p.remaining)}</span><button onclick="remPen('${t}',${i})" style="background:red; color:white; border:none; padding:0 4px; border-radius:3px">X</button>`;
                ctrl.appendChild(c);
            });
        }

        function renderSO() {
            const draw = (id, arr) => {
                const el = document.getElementById(id); el.innerHTML = '';
                for(let i=0; i<Math.max(5, arr.length); i++) {
                    const d = document.createElement('div'); d.className = 'dot' + (arr[i] ? ' ' + arr[i] : '');
                    el.appendChild(d);
                }
            };
            draw('so-dots-home', soHome); draw('so-dots-away', soAway);
        }

        function triggerTimeout() {
            if (!isTimeout) {
                isTimeout = true; savedGameTime = timeLeft; timeLeft = 25000;
                document.getElementById('timeoutBtn').innerText = "ZRUŠIT";
                document.getElementById('timeoutBtn').className = "btn-stop";
                if (!isRunning) toggleTimer();
            } else { endTimeout(); }
        }

        function endTimeout() {
            isTimeout = false; timeLeft = savedGameTime;
            document.getElementById('timeoutBtn').innerText = "TIMEOUT (25s)";
            document.getElementById('timeoutBtn').className = "btn-timeout";
            if (isRunning) toggleTimer();
            updateDisplay();
        }

        function toggleTimer() {
            const btn = document.getElementById('mainBtn');
            if (!isRunning) {
                isRunning = true; lastTs = performance.now();
                requestAnimationFrame(tick);
                btn.innerText = "STOP"; btn.className = "btn-stop";
            } else {
                isRunning = false; btn.innerText = "START"; btn.className = "btn-start";
            }
        }

        function tick(ts) {
            if (!isRunning) return;
            let d = ts - lastTs; lastTs = ts;
            timeLeft = Math.max(0, timeLeft - d);
            if (!isTimeout) {
                [penaltiesHome, penaltiesAway].forEach(l => l.forEach(p => p.remaining -= d));
                penaltiesHome = penaltiesHome.filter(p => p.remaining > 0);
                penaltiesAway = penaltiesAway.filter(p => p.remaining > 0);
            }
            updateDisplay();
            if (timeLeft <= 0) {
                if (isTimeout) endTimeout();
                else { isRunning = false; document.getElementById('mainBtn').innerText = "START"; document.getElementById('mainBtn').className = "btn-start"; }
            } else { requestAnimationFrame(tick); }
        }

        function changeScore(t, v) { if(t==='home') scoreHome=Math.max(0,scoreHome+v); else scoreAway=Math.max(0,scoreAway+v); updateDisplay(); }
        function setManualTime() { timeLeft = (parseInt(document.getElementById('in-min').value || 0) * 60 + parseInt(document.getElementById('in-sec').value || 0)) * 1000; updateDisplay(); }
        function addPenalty(t, m) { const l=(t==='home')?penaltiesHome:penaltiesAway; if(l.length < 2) l.push({remaining:m*60000}); updateDisplay(); }
        function remPen(t, i) { if(t==='home') penaltiesHome.splice(i,1); else penaltiesAway.splice(i,1); updateDisplay(); }
        function addSO(t, res) { if(t==='home') soHome.push(res); else soAway.push(res); updateDisplay(); }
        function resetSO(t) { if(t==='home') soHome=[]; else soAway=[]; updateDisplay(); }

        updateDisplay();
    </script>
</body>
</html>
